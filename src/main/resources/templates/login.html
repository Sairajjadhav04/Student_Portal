<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Portal - Login</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="login-container">

  <h1>Student Portal</h1>
  <h2>Login</h2>

  <form id="loginForm">

    <label for="username">Username</label>
    <input
            type="text"
            id="username"
            placeholder="Enter username"
            required
    >

    <label for="password">Password</label>
    <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
    >
    <p>
      Don't have an account?
      <a href="/register">Register here</a>
    </p>

    <button type="submit">Login</button>

  </form>

  <p id="message"></p>

</div>


<script>

  document
          .getElementById("loginForm")
          .addEventListener(
                  "submit",

                  async function(event) {

                    event.preventDefault();


                    const username =
                            document.getElementById(
                                    "username"
                            ).value;


                    const password =
                            document.getElementById(
                                    "password"
                            ).value;


                    const message =
                            document.getElementById(
                                    "message"
                            );


                    try {

                      const response =
                              await fetch(
                                      "/api/auth/login",
                                      {

                                        method: "POST",

                                        headers: {

                                          "Content-Type":
                                                  "application/json"

                                        },

                                        body:
                                                JSON.stringify({

                                                  username:
                                                  username,

                                                  password:
                                                  password

                                                })

                                      }
                              );


                      const data =
                              await response.json();



                      if (response.ok) {


                        // Save JWT
                        localStorage.setItem(
                                "token",
                                data.token
                        );


                        // Save role
                        localStorage.setItem(
                                "role",
                                data.role
                        );


                        message.style.color =
                                "#15803D";


                        message.textContent =
                                "Login successful!";


                        // =========================
                        // ROLE-WISE REDIRECTION
                        // =========================

                        if (
                                data.role === "STUDENT"
                        ) {

                          window.location.href =
                                  "/student/dashboard";

                        }


                        else if (
                                data.role === "FACULTY"
                        ) {

                          window.location.href =
                                  "/faculty/dashboard";

                        }


                        else if (
                                data.role === "ADMIN"
                        ) {

                          window.location.href =
                                  "/admin/dashboard";

                        }


                        else {

                          message.textContent =
                                  "Invalid user role.";

                        }

                      }


                      else {

                        message.style.color =
                                "#D64545";


                        message.textContent =
                                data.message ||
                                data.error ||
                                "Invalid username or password.";

                      }


                    }


                    catch (error) {

                      console.error(error);


                      message.style.color =
                              "#D64545";


                      message.textContent =
                              "Unable to connect to the server.";

                    }

                  }
          );

</script>
</body>
</html>
