<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <title>Student Portal | Assignments</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin-faculty.css">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="logo">

            <h2>Student Portal</h2>

            <span>College Dashboard</span>

        </div>

        <nav class="sidebar-nav">

            <a href="/faculty/dashboard"
               class="nav-item">
                Dashboard
            </a>

            <a href="/faculty/profile"
               class="nav-item">
                Profile
            </a>

            <a href="/faculty/students"
               class="nav-item">
                Students
            </a>

            <a href="/faculty/subjects"
               class="nav-item">
                Subjects
            </a>

            <a href="/faculty/assignments"
               class="nav-item active">
                Assignments
            </a>

            <a href="/faculty/attendance"
               class="nav-item">
                Attendance
            </a>

            <a href="/faculty/marks"
               class="nav-item">
                Marks
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="/login"
               class="nav-item logout">

                Logout

            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="page-label">
                    FACULTY MODULE
                </p>

                <h1>Assignments</h1>

                <p class="subtitle">
                    College Dashboard
                </p>

            </div>


            <div class="student-mini-profile">

                <div class="profile-avatar">
                    F
                </div>

                <div>

                    <strong>Faculty</strong>

                    <span>Faculty</span>

                </div>

            </div>

        </header>


        <div class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>Assignments</h2>

                    <p>
                        Manage assignments records.
                    </p>

                </div>


                <button
                        class="portal-btn primary"
                        onclick="openPortalModal('modal')">

                    + Add

                </button>

            </div>


            <div class="portal-filter">

                <input
                        class="portal-input"
                        id="search"
                        placeholder="Search..."
                        oninput="render()">

            </div>


            <div class="portal-table-wrap">

                <table class="portal-table">

                    <thead>

                    <tr>

                        <th>Title</th>
                        <th>Subject</th>
                        <th>Due Date</th>
                        <th>Status</th>

                    </tr>

                    </thead>

                    <tbody id="rows"></tbody>

                </table>

            </div>


            <!-- ADD ASSIGNMENT MODAL -->

            <div class="portal-modal"
                 id="modal">

                <div class="portal-modal-box">

                    <div class="portal-modal-head">

                        <h2>Add Assignment</h2>

                        <button
                                type="button"
                                class="portal-close"
                                onclick="closePortalModal('modal')">

                            ×

                        </button>

                    </div>


                    <form
                            id="form"
                            class="portal-form-grid">


                        <div class="portal-form-group">

                            <label>Title</label>

                            <input
                                    class="portal-input"
                                    name="title"
                                    required>

                        </div>


                        <div class="portal-form-group">

                            <label>Subject ID</label>

                            <input
                                    class="portal-input"
                                    name="subjectId"
                                    type="number"
                                    required>

                        </div>


                        <div class="portal-form-group">

                            <label>Due Date</label>

                            <input
                                    class="portal-input"
                                    name="dueAt"
                                    type="date"
                                    required>

                        </div>


                        <div class="portal-form-group">

                            <label>Description</label>

                            <input
                                    class="portal-input"
                                    name="description">

                        </div>


                        <div class="portal-form-group full">

                            <button
                                    type="submit"
                                    class="portal-btn primary">

                                Save

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </main>

</div>


<script src="/js/admin.js"></script>


<script>

    let data = [];


    // ==========================================
    // LOAD ASSIGNMENTS
    // ==========================================

    async function load() {

        try {

            // Get logged-in user
            const user =
                await portalApi('/api/auth/me');


            // Check Faculty role
            if (user.role !== 'FACULTY') {

                portalToast(
                    'You are not logged in as Faculty.'
                );

                return;
            }


            // Faculty ID
            const facultyId = user.id;


            // Get assignments of this faculty
            data =
                portalArray(
                    await portalApi(
                        '/api/faculty/assignments/' +
                        facultyId
                    )
                );


            render();

        } catch (e) {

            console.error(e);

            portalToast(e.message);

        }

    }


    // ==========================================
    // RENDER ASSIGNMENTS
    // ==========================================

    function render() {

        const q =
            (
                document.getElementById('search')
                    ?.value || ''
            ).toLowerCase();


        const assignments =
            data.filter(x =>
                JSON.stringify(x)
                    .toLowerCase()
                    .includes(q)
            );


        document.getElementById('rows').innerHTML =

            assignments.length

                ?

                assignments.map(x => `

                    <tr>

                        <td>
                            ${pEsc(x.title || "--")}
                        </td>

                        <td>
                            ${
                    pEsc(
                        x.subject?.name ||
                        x.subjectName ||
                        x.subject?.subjectName ||
                        "--"
                    )
                }
                        </td>

                        <td>
                            ${pEsc(x.dueDate || "--")}
                        </td>

                        <td>
                            ${pEsc(x.status || "Assigned")}
                        </td>

                    </tr>

                `).join('')

                :

                `
                    <tr>

                        <td colspan="4"
                            class="portal-empty">

                            No assignments found.

                        </td>

                    </tr>
                `;

    }


    // ==========================================
    // ADD ASSIGNMENT
    // ==========================================

    document.getElementById('form').onsubmit =
        async function(e) {

            e.preventDefault();


            try {

                // Get logged-in Faculty
                const user =
                    await portalApi('/api/auth/me');


                if (user.role !== 'FACULTY') {

                    portalToast(
                        'You are not logged in as Faculty.'
                    );

                    return;
                }


                const facultyId = user.id;


                // Get form data
                const formData =
                    new FormData(e.target);


                const params =
                    new URLSearchParams();


                // Backend uses @RequestParam
                params.append(
                    'facultyId',
                    facultyId
                );


                params.append(
                    'subjectId',
                    formData.get('subjectId')
                );


                params.append(
                    'title',
                    formData.get('title')
                );


                params.append(
                    'description',
                    formData.get('description') || ''
                );


                params.append(
                    'dueAt',
                    formData.get('dueAt')
                );


                // Send POST request
                await portalApi(
                    '/api/faculty/assignments',
                    {
                        method: 'POST',
                        body: params
                    }
                );


                portalToast(
                    'Assignment added successfully.'
                );


                closePortalModal('modal');

                e.target.reset();


                // Reload assignments
                load();

            } catch (e) {

                console.error(e);

                portalToast(e.message);

            }

        };


    // ==========================================
    // START
    // ==========================================

    load();

</script>

</body>
</html>
