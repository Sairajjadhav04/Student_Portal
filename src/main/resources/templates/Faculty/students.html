<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Portal | Students</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin-faculty.css">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="logo">
            <h2>Student Portal</h2>
            <span>College Dashboard</span>
        </div>

        <nav class="sidebar-nav">

            <a href="/faculty/dashboard" class="nav-item">
                Dashboard
            </a>

            <a href="/faculty/profile" class="nav-item">
                Profile
            </a>

            <a href="/faculty/students" class="nav-item active">
                Students
            </a>

            <a href="/faculty/subjects" class="nav-item">
                Subjects
            </a>

            <a href="/faculty/assignments" class="nav-item">
                Assignments
            </a>

            <a href="/faculty/attendance" class="nav-item">
                Attendance
            </a>

            <a href="/faculty/marks" class="nav-item">
                Marks
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="/login" class="nav-item logout">
                Logout
            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="page-label">
                    FACULTY MODULE
                </p>

                <h1>Students</h1>

                <p class="subtitle">
                    View all students
                </p>

            </div>


            <div class="student-mini-profile">

                <div class="profile-avatar">
                    F
                </div>

                <div>
                    <strong>Faculty</strong>
                    <span>Faculty</span>
                </div>

            </div>

        </header>


        <div class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>Students</h2>

                    <p>
                        Students registered in the portal.
                    </p>

                </div>

                <button
                        class="portal-btn primary"
                        onclick="loadStudents()">

                    Refresh

                </button>

            </div>


            <div class="portal-table-wrap">

                <table class="portal-table">

                    <thead>

                    <tr>

                        <th>#</th>

                        <th>Student</th>

                        <th>Roll No.</th>

                        <th>Email</th>

                        <th>Course</th>

                    </tr>

                    </thead>

                    <tbody id="studentRows">

                    <tr>

                        <td colspan="5">
                            Loading students...
                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </main>

</div>


<script src="/js/admin.js"></script>

<script>

    async function loadStudents() {

        const rows =
            document.getElementById("studentRows");

        try {

            const response =
                await portalApi("/api/faculty/students");

            const students =
                portalArray(response);


            if (!students.length) {

                rows.innerHTML = `
                <tr>
                    <td colspan="5">
                        No students found.
                    </td>
                </tr>
            `;

                return;
            }


            rows.innerHTML = students.map(
                (student, index) => `

            <tr>

                <td>
                    ${index + 1}
                </td>

                <td>
                    ${pEsc(
                    student.fullName ||
                    student.name ||
                    "--"
                )}
                </td>

                <td>
                    ${pEsc(
                    student.rollNo ||
                    student.rollNumber ||
                    "--"
                )}
                </td>

                <td>
                    ${pEsc(
                    student.email ||
                    "--"
                )}
                </td>

                <td>
                    ${pEsc(
                    student.course?.name ||
                    student.courseName ||
                    "--"
                )}
                </td>

            </tr>

        `).join("");

        } catch (e) {

            console.error(e);

            rows.innerHTML = `
            <tr>
                <td colspan="5">
                    Unable to load students.
                </td>
            </tr>
        `;

            portalToast(e.message);
        }

    }


    loadStudents();

</script>

</body>

</html>
