<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <title>Student Portal | Attendance</title>

    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin-faculty.css">

</head>

<body>

<div class="dashboard-container">

    <aside class="sidebar">

        <div class="logo">

            <h2>Student Portal</h2>

            <span>College Dashboard</span>

        </div>


        <nav class="sidebar-nav">

            <a href="/faculty/dashboard"
               class="nav-item">
                Dashboard
            </a>

            <a href="/faculty/profile"
               class="nav-item">
                Profile
            </a>

            <a href="/faculty/students"
               class="nav-item">
                Students
            </a>

            <a href="/faculty/subjects"
               class="nav-item">
                Subjects
            </a>

            <a href="/faculty/assignments"
               class="nav-item">
                Assignments
            </a>

            <a href="/faculty/attendance"
               class="nav-item active">
                Attendance
            </a>

            <a href="/faculty/marks"
               class="nav-item">
                Marks
            </a>

        </nav>


        <div class="sidebar-bottom">

            <a href="/login"
               class="nav-item logout">

                Logout

            </a>

        </div>

    </aside>


    <main class="main-content">

        <header class="topbar">

            <div>

                <p class="page-label">
                    FACULTY MODULE
                </p>

                <h1>Attendance</h1>

                <p class="subtitle">
                    College Dashboard
                </p>

            </div>


            <div class="student-mini-profile">

                <div class="profile-avatar">
                    F
                </div>

                <div>

                    <strong>Faculty</strong>

                    <span>Faculty</span>

                </div>

            </div>

        </header>


        <div class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>Attendance</h2>

                    <p>
                        Manage student attendance.
                    </p>

                </div>

            </div>


            <div class="portal-form-grid">

                <div class="portal-form-group">

                    <label>
                        Subject ID
                    </label>

                    <input
                            class="portal-input"
                            id="subjectId">

                </div>


                <div class="portal-form-group">

                    <label>
                        Date
                    </label>

                    <input
                            class="portal-input"
                            type="date"
                            id="date">

                </div>

            </div>


            <br>


            <button
                    class="portal-btn primary"
                    onclick="loadStudents()">

                Load Students

            </button>


            <div class="portal-table-wrap">

                <table class="portal-table">

                    <thead>

                    <tr>

                        <th>
                            Student
                        </th>

                        <th>
                            Roll No.
                        </th>

                        <th>
                            Status
                        </th>

                    </tr>

                    </thead>

                    <tbody id="rows"></tbody>

                </table>

            </div>


            <button
                    class="portal-btn primary"
                    onclick="save()">

                Save Attendance

            </button>

        </div>

    </main>

</div>


<script src="/js/admin.js"></script>


<script>

    let students = [];


    async function loadStudents() {

        try {

            students =
                portalArray(
                    await portalApi(
                        '/api/faculty/students'
                    )
                );


            document.getElementById(
                'rows'
            ).innerHTML =

                students.map(
                    (x,i) => `

                <tr>

                    <td>
                        ${pEsc(
                        x.name || "--"
                    )}
                    </td>

                    <td>
                        ${pEsc(
                        x.rollNo || "--"
                    )}
                    </td>

                    <td>

                        <select
                            class="portal-input"
                            id="att_${i}">

                            <option value="PRESENT">
                                Present
                            </option>

                            <option value="ABSENT">
                                Absent
                            </option>

                        </select>

                    </td>

                </tr>

            `
                ).join('');

        } catch(e) {

            portalToast(e.message);

        }

    }


    async function save() {

        let subjectId =
            document.getElementById(
                'subjectId'
            ).value;


        let date =
            document.getElementById(
                'date'
            ).value;


        if (!subjectId || !date) {

            portalToast(
                'Enter subject and date'
            );

            return;

        }


        let records =
            students.map(
                (x,i) => ({

                    studentId: x.id,

                    subjectId: subjectId,

                    date: date,

                    status:
                    document.getElementById(
                        'att_' + i
                    ).value

                })
            );


        try {

            await portalApi(
                '/api/faculty/attendance',
                {
                    method: 'POST',

                    body:
                        JSON.stringify(records)
                }
            );


            portalToast(
                'Attendance saved'
            );

        } catch(e) {

            portalToast(e.message);

        }

    }

</script>

</body>
</html>
