<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

<header>
    <h1>Student Dashboard</h1>
    <p>Welcome, Student!</p>
</header>

<main>

    <section class="card">
        <h2>📊 Attendance</h2>
        <p>Check your attendance percentage.</p>
        <button>View Attendance</button>
    </section>

    <section class="card">
        <h2>📝 Assignments</h2>
        <p>View and submit your assignments.</p>
        <button>View Assignments</button>
    </section>

    <section class="card">
        <h2>📚 Results</h2>
        <p>Check your marks and academic results.</p>
        <button>View Results</button>
    </section>

    <section class="card">
        <h2>📅 Timetable</h2>
        <p>View your daily class timetable.</p>
        <button>View Timetable</button>
    </section>

</main>

</body>

</html>
