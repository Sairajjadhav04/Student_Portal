services:

  postgres:
    image: postgres:16
    container_name: student-portal-db
    environment:
      POSTGRES_DB: student_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: student-portal-app
    depends_on:
      - postgres
    environment:
      DB_PASSWORD: postgres
      JWT_SECRET: student-portal-secret-key-change-this-later
    ports:
      - "8081:8081"

volumes:
  postgres_data: